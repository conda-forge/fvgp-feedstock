schema_version: 1

context:
  name: fvgp
  version: 4.9.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fvgp-${{ version }}.tar.gz
  sha256: e96d304c9a3b485183d5319eb08d9ed20ecda86e5ddf5a6430b0fce5857ac620

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - wheel
    - scipy >=1.13
    - numpy >=2.1
    - dask-core >=2024.1
    - distributed >=2024.1
    - hgdl >=2.4.2,<2.5.dev0
    - loguru
tests:
  - python:
      imports:
        - fvgp
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Python package for highly flexible function-valued Gaussian processes (fvGP)
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/lbl-camera/fvGP

extra:
  recipe-maintainers:
    - jan-janssen
